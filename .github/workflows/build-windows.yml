name: Build Windows EXE (Éditeur EAD)

on:
  push:
    paths:
      - "app/ead_editor/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/ead_editor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Lancer les tests
        run: python -m pytest -q

      - name: Construire l'exécutable
        run: pyinstaller build/ead_editor.spec --distpath ../dist

      - name: Publier l'artefact (rétention limitée, run CI)
        uses: actions/upload-artifact@v4
        with:
          name: EditeurEAD-windows
          path: app/dist/EditeurEAD.exe
          if-no-files-found: error

      - name: Publier en release "dernier build" (lien stable et permanent)
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=build-ead-editor
          REPO="${{ github.repository }}"
          NOTES="Généré automatiquement par CI depuis app/ead_editor.
          Commit : ${{ github.sha }}
          Date : $(date -u +%Y-%m-%dT%H:%MZ)"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "Éditeur EAD — dernier build" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
          gh release upload "$TAG" app/dist/EditeurEAD.exe --repo "$REPO" --clobber
